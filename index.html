<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- A pinch on the painting must scroll nothing and zoom nothing (no user scaling). No
         viewport-fit=cover: Compose on the web reports zero safe-area insets, so under cover the
         pinned pill sat in iOS Safari's home-indicator swipe zone; Safari's own safe margins keep
         it clear, filled with the page colour (final submission pass 2026-09-25). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#1A1310">
    <title>Unroomies</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body style="text-align: center; align-content: center">
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
    <circle cx="25" cy="25" r="20" stroke="#4A382D" stroke-width="4" fill="none"/>
    <circle cx="25" cy="25" r="20" stroke="#FB923C" stroke-width="4" fill="none" stroke-linecap="round"
            stroke-dasharray="90 125">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                          repeatCount="indefinite"/>
    </circle>
</svg>
<!-- GitHub Pages cannot send COOP/COEP headers; this service worker adds them on the
     second load so SharedArrayBuffer and OPFS persistence work. First visit reloads once. -->
<script src="coi-serviceworker.min.js"></script>
<script type="application/javascript" src="webApp.js"></script>
</body>
</html>
